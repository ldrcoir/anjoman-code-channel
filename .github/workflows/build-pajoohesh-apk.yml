name: build-pajoohesh-apk

on:
  push:
    paths:
      - "EMA/app-ha/kotlin-pajoohesh-app/**"
      - "enteshar/**"
      - ".github/workflows/build-pajoohesh-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # کلید امضا در ریپوی عمومی نمی‌نشیند — هنگام بیلد از ریپوی خصوصی mahramaneh می‌آید
      - name: Fetch signing key from private repo
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          mkdir -p enteshar
          ok=0
          for f in klid-ehsanmorad.jks klid.properties rahnamaye-enteshar.md; do
            code=$(curl -sS -o "enteshar/$f" -w "%{http_code}" -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/ldrcoir/anjoman-mahramaneh/main/android-signing/$f")
            echo "$f: http $code"
            [ "$code" = "200" ] && ok=$((ok+1))
          done
          if [ "$ok" != "3" ]; then echo "کلید امضا کامل نیامد — بیلد release امضاشده شکست می‌خورد"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # صفحات کتاب (عکس دانش‌آموزان) در ریپوی عمومی نیست — از ریپوی خصوصی می‌آید
      - name: Fetch book content from private repo
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          mkdir -p EMA/app-ha/kotlin-pajoohesh-app/app/src/main/assets
          code=$(curl -sS -o /tmp/assets.zip -w "%{http_code}" -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/ldrcoir/pajoohesh-pages/main/assets.zip")
          echo "http: $code | size: $(wc -c < /tmp/assets.zip) bytes"
          if [ "$code" = "200" ] && [ -s /tmp/assets.zip ]; then
            unzip -o -q /tmp/assets.zip -d EMA/app-ha/kotlin-pajoohesh-app/app/src/main/assets
            echo "pages: $(ls EMA/app-ha/kotlin-pajoohesh-app/app/src/main/assets/pages | wc -l)"
            echo "cover: $(ls -la EMA/app-ha/kotlin-pajoohesh-app/app/src/main/assets/cover.webp | awk '{print $5}') bytes"
            echo "matn: $(ls -la EMA/app-ha/kotlin-pajoohesh-app/app/src/main/assets/matn.json | awk '{print $5}') bytes"
          else
            echo "محتوا نیامد — بیلد بدون محتوا ادامه می‌یابد"
          fi

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # نسخهٔ release امضاشده با کلیدی که گام قبل از ریپوی خصوصی گرفت
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
        working-directory: EMA/app-ha/kotlin-pajoohesh-app

      - name: Verify APK signature
        working-directory: EMA/app-ha/kotlin-pajoohesh-app
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/sig.txt
          head -4 /tmp/sig.txt

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DastavardhayePajoohesh-v1.3.apk
        working-directory: EMA/app-ha/kotlin-pajoohesh-app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastavardha-pajoohesh-apk
          path: EMA/app-ha/kotlin-pajoohesh-app/DastavardhayePajoohesh-v1.3.apk
          if-no-files-found: error

name: build-hesab-apk

on:
  push:
    paths:
      - "EMA/app-ha/kotlin-hesab-app/**"
      - ".github/workflows/build-hesab-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: EMA/app-ha/kotlin-hesab-app

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MashinHesab-EmaRoid-v2.0-debug.apk
        working-directory: EMA/app-ha/kotlin-hesab-app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mashin-hesab-apk
          path: EMA/app-ha/kotlin-hesab-app/MashinHesab-EmaRoid-v2.0-debug.apk
          retention-days: 1
          if-no-files-found: error

# گردش ۶۵ — پاک‌سازی یک‌بارهٔ آرتیفکت‌های Actions (توکن اکشنز، خودپاک‌شونده)
# این ورک‌فلو با پوش همین فایل اجرا می‌شود؛ پس از انجام کار، فایل حذف می‌شود.
name: pak-artifact-ha
on:
  push:
    paths: ['.github/workflows/pak-artifact-ha.yml']
permissions:
  actions: write
jobs:
  pak:
    runs-on: ubuntu-latest
    steps:
      - name: حذف همهٔ آرتیفکت‌های دانلودشده/بی‌مصرف
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
            | jq -r '.artifacts[].id' \
            | while read id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "deleted $id"
              done
          echo "باقی‌مانده:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" --jq '.total_count'

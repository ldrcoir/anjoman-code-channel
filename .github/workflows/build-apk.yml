name: build-apk

on:
  push:
    paths:
      - "kotlin-amoozesh-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: kotlin-amoozesh-app

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AmoozeshKotlin-v1.0-debug.apk
        working-directory: kotlin-amoozesh-app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amoozesh-kotlin-apk
          path: kotlin-amoozesh-app/AmoozeshKotlin-v1.0-debug.apk
          if-no-files-found: error

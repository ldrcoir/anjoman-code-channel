name: pak-ran-ha
on:
  push:
    paths:
      - ".github/workflows/pak-ran-ha.yml"

permissions:
  actions: write

jobs:
  pak:
    runs-on: ubuntu-latest
    steps:
      - name: pak kardan-e tarikhche-ye ran-ha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KHOD: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          TOK = os.environ["GH_TOKEN"]; REPO = os.environ["REPO"]; KHOD = os.environ["KHOD"]
          H = {"Authorization": f"Bearer {TOK}", "Accept": "application/vnd.github+json"}
          NOCARE = {"pak-artifact-ha", "pak-ran-ha"}

          def req(url, method="GET"):
              r = urllib.request.Request(url, headers=H, method=method)
              try:
                  x = urllib.request.urlopen(r, timeout=60); b = x.read()
                  return x.status, (json.loads(b) if b else {})
              except urllib.error.HTTPError:
                  return 0, {}

          def all_runs():
              out, p = [], 1
              while True:
                  st, d = req(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=100&page={p}")
                  out += d.get("workflow_runs", [])
                  if len(d.get("workflow_runs", [])) < 100 or p >= 10: break
                  p += 1
              return out

          runs = all_runs()
          keep = {}
          for r in sorted(runs, key=lambda x: x["run_number"]):
              if r["conclusion"] == "success" and r["name"] not in NOCARE:
                  keep[r["workflow_id"]] = r["id"]
          kids = set(keep.values())
          n = ok = 0
          for r in runs:
              if r["id"] in kids or str(r["id"]) == KHOD:
                  continue
              st, _ = req(f"https://api.github.com/repos/{REPO}/actions/runs/{r['id']}", "DELETE")
              n += 1
              if st in (204, 404): ok += 1
              else: print(f"  khata: ran {r['id']} ({r['name']}) -> {st}")
              time.sleep(0.1)
          print(f"hazf: {ok}/{n}")
          left = all_runs()
          print("mandeh:")
          for r in sorted(left, key=lambda x: x["run_number"]):
              print(f"  #{r['run_number']} {r['conclusion']} {r['name']}")
          # حذف رانِ خودِ این پاک‌سازی — اگر گیت‌هاب اجازهٔ حذف ران در حال اجرا را بدهد، صفحه کاملاً تمیز می‌شود
          st, _ = req(f"https://api.github.com/repos/{REPO}/actions/runs/{KHOD}", "DELETE")
          print("self-delete:", st)
          PY

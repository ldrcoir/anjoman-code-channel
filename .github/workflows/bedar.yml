# ⛔ غیرفعال‌شده به دستور مالک (۱۴۰۵-۰۸-۰۳):
# «اعتماد نمی‌کنم به اون برنامه و صف؛ خودت باید بیای این کارو انجام بدی:
# اول محتوای هر کانال را چک می‌کنی، اگر تکراری نبود پست می‌گذاری، دسته‌بندی هم خودت»
# دلیل: درس ۵ سه بار و تسلیت انرژی دوبار منتشر شد (دوبارسازی دیمون + CI).
# از این پس انتشار فقط توسط ایجنت با اسکن زندهٔ کانال انجام می‌شود.
# برای فعال‌سازی دوباره: schedule را برگردان + secrets را چک کن.
name: bedar (DISABLED)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "فقط شبیه‌سازی (بدون انتشار)"
        required: false
        default: "true"

permissions:
  contents: read
concurrency:
  group: bedar
  cancel-in-progress: false

jobs:
  bedar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: pip install requests pillow

      - name: آماده‌سازی محیط (env رمزی + فونت + چیدمان مسیرها)
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config --global user.name "roznegar-bot"
          git config --global user.email "roznegar-bot@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/root"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/root/anjoman-code-bot"
          printf 'BALE_TOKEN=%s\nGITHUB_TOKEN=%s\n' "$BALE_TOKEN" "$GH_PUSH_TOKEN" \
            > "$RUNNER_TEMP/root/.env"

      - name: اجرای بیدار
        env:
          ANJOMAN_ROOT: ${{ runner.temp }}/root
          ANJOMAN_REPO: ${{ github.workspace }}
          ANJOMAN_FONT_DIR: ${{ github.workspace }}/assets/fonts
          BEDAR_DRY: ${{ github.event.inputs.dry || github.event.client_payload.dry || 'false' }}
        run: python scripts/bedar_ci.py

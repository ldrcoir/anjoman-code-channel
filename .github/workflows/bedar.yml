# بیدار — لایهٔ ۳ پایداری انتشار
# اگر سرور اصلی ریست شود و دیمون خاموش بماند، این workflow از بیرونِ سرور
# اسلات‌های ازدست‌رفتهٔ امروز را منتشر می‌کند (روزی ۵ بار گارد).
# ران‌ها ۱۰ دقیقه بعد از ساعت دیمون‌اند؛ اگر سرور زنده باشد state تازه در
# گیت‌هاب push شده و اینجا «انجام شده» شناخته می‌شود — دوبارسازی ندارد.
name: bedar

on:
  schedule:
    - cron: "5 6 * * *"     # ۰۹:۳۵ تهران — مناسبت‌ها
    - cron: "20 6 * * *"    # ۰۹:۵۰ تهران — پشتیبان صبحگاهی ۱ (تکرار گیت‌هاب گاهی ران‌ها را حذف می‌کند)
    - cron: "40 6 * * *"    # ۱۰:۱۰ تهران — درس Rust
    - cron: "10 7 * * *"    # ۱۰:۴۰ تهران — پشتیبان صبحگاهی ۲ (جبران درس اگر دیمون مرده بود)
    - cron: "40 14 * * *"   # ۱۸:۱۰ تهران — مجلهٔ ماهانه
    - cron: "40 15 * * *"   # ۱۹:۱۰ تهران — پست متنوع
    - cron: "30 16 * * *"   # ۲۰:۰۰ تهران — جبران کلیِ هر اسلات جاافتاده
  repository_dispatch:
    types: [bedar]
  workflow_dispatch:
    inputs:
      dry:
        description: "فقط شبیه‌سازی (بدون انتشار)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: bedar
  cancel-in-progress: false

jobs:
  bedar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی‌ها
        run: pip install requests pillow

      - name: آماده‌سازی محیط (env رمزی + فونت + چیدمان مسیرها)
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config --global user.name "roznegar-bot"
          git config --global user.email "roznegar-bot@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/root"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/root/anjoman-code-bot"
          printf 'BALE_TOKEN=%s\nGITHUB_TOKEN=%s\n' "$BALE_TOKEN" "$GH_PUSH_TOKEN" \
            > "$RUNNER_TEMP/root/.env"

      - name: اجرای بیدار
        env:
          ANJOMAN_ROOT: ${{ runner.temp }}/root
          ANJOMAN_REPO: ${{ github.workspace }}
          ANJOMAN_FONT_DIR: ${{ github.workspace }}/assets/fonts
          BEDAR_DRY: ${{ github.event.inputs.dry || github.event.client_payload.dry || 'false' }}
        run: python scripts/bedar_ci.py

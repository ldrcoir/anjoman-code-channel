name: build-sandogh-apk

on:
  push:
    paths:
      - "EMA/app-ha/kotlin-sandogh-app/**"
      - ".github/workflows/build-sandogh-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # دادهٔ کتابچه از Secret می‌آید تا هرگز در ریپوی عمومی نباشد
      - name: Write ledger data from secret
        env:
          LEDGER_B64: ${{ secrets.SANDOGH_LEDGER }}
        run: |
          mkdir -p EMA/app-ha/kotlin-sandogh-app/app/src/main/assets
          if [ -n "$LEDGER_B64" ]; then
            printf '%s' "$LEDGER_B64" | base64 -d > EMA/app-ha/kotlin-sandogh-app/app/src/main/assets/ledger.json
            echo "ledger.json: $(wc -c < EMA/app-ha/kotlin-sandogh-app/app/src/main/assets/ledger.json) bytes"
          else
            echo "SANDOGH_LEDGER خالی است — بیلد بدون داده"
          fi

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: EMA/app-ha/kotlin-sandogh-app

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KetabcheSandogh-v1.0-debug.apk
        working-directory: EMA/app-ha/kotlin-sandogh-app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketabche-sandogh-apk
          path: EMA/app-ha/kotlin-sandogh-app/KetabcheSandogh-v1.0-debug.apk
          if-no-files-found: error
